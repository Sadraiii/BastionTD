# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    # The game uses UIKit, so build it for iPhone rather than for the Mac. There are no test targets.
    - name: Build
      run: swift build --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios17.0
    - name: Balance sim
      continue-on-error: true
      timeout-minutes: 25
      run: sh Tools/run_balance_sim.sh
